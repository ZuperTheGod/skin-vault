name: release
# Bump VERSION in skin_manager.py and push to main -> a GitHub Release vX.Y.Z is created automatically.
# Every Skin Vault install checks for new releases and offers a one-click update.
on:
  push:
    branches: [main]
    paths: [skin_manager.py]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt && python tests/run_tests.py
      - name: Create release if VERSION is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(python -c "import re;print(re.search(r'^VERSION\s*=\s*\"([^\"]+)\"', open('skin_manager.py').read(), re.M).group(1))")
          if gh release view "v$V" >/dev/null 2>&1; then echo "v$V already released"; exit 0; fi
          gh release create "v$V" --title "Skin Vault v$V" --generate-notes
