<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skin Vault</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d1420'/%3E%3Cpath d='M32 9l19 9v14c0 12-8 20-19 24-11-4-19-12-19-24V18z' fill='none' stroke='%23c8aa6e' stroke-width='4'/%3E%3Cpath d='M24 33l6 6 11-13' fill='none' stroke='%230ac8b9' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070b12; --panel:#0d1420; --panel2:#121b2a; --line:#1e2a3d; --line2:#2a3a52;
  --text:#e8ecf2; --muted:#8a97ab; --dim:#5d6a7e;
  --gold:#c8aa6e; --gold2:#f0e6d2; --teal:#0ac8b9;
  --err:#ff5a5f; --warn:#f5b041; --info:#5aa9ff; --ok:#3ccf91;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,Segoe UI,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;outline:none}
input:focus,select:focus{border-color:var(--gold)}
a{color:var(--teal)}
.app{display:grid;grid-template-columns:300px 1fr;grid-template-rows:60px 1fr;height:100vh}
header{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:0 18px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#0e1726,#0a111c)}
.brand{font-family:Cinzel,serif;font-size:20px;letter-spacing:.06em;color:var(--gold);white-space:nowrap}
.brand small{font-family:Inter;font-size:11px;color:var(--dim);letter-spacing:0;margin-left:8px}
.stats{display:flex;gap:14px;color:var(--muted);font-size:12.5px;margin-left:8px;white-space:nowrap;overflow:hidden;min-width:0}
@media (max-width:1500px){header .btn{padding-left:10px;padding-right:10px}}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
.stats b{color:var(--text);font-weight:600}
.stats .e b{color:var(--err)} .stats .w b{color:var(--warn)}
.spacer{flex:1}
.btn{background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:7px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--gold);color:var(--gold2)}
.btn.primary{background:linear-gradient(180deg,#1e5c66,#124048);border-color:#1f7f86}
.btn.gold{background:linear-gradient(180deg,#3a2f17,#251d0d);border-color:#7a6232;color:var(--gold2)}
.btn.small{padding:4px 9px;font-size:12px}
.btn[disabled]{opacity:.45;pointer-events:none}
.badge{display:inline-block;min-width:18px;padding:0 6px;border-radius:9px;background:var(--line2);font-size:11px;text-align:center;line-height:18px}
.badge.e{background:var(--err);color:#fff}.badge.w{background:var(--warn);color:#111}

aside{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.side-top{padding:12px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.side-top input{width:100%}
.toggles{display:flex;gap:6px;flex-wrap:wrap}
.tg{font-size:12px;padding:4px 9px;border-radius:14px;border:1px solid var(--line2);background:transparent;color:var(--muted)}
.tg.on{border-color:var(--gold);color:var(--gold2);background:#2a2312}
.champ-list{overflow:auto;padding:6px 6px 20px}
.sec-label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);padding:12px 8px 6px}
.crow{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.crow:hover{background:var(--panel2)}
.crow.sel{background:#1a2333;border-color:var(--line2)}
.crow img,.crow .ph{width:34px;height:34px;border-radius:6px;border:1px solid var(--line2);flex:none;object-fit:cover;background:#1a2333}
.crow .ph{display:grid;place-items:center;color:var(--gold);font-weight:700}
.crow .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow.empty{opacity:.45}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.dot.error{background:var(--err)}.dot.warn{background:var(--warn)}

main{overflow:auto;min-height:0;position:relative}
.hero{position:relative;height:210px;background:#0b111b center 20%/cover no-repeat;border-bottom:1px solid var(--line)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(7,11,18,.95) 0%,rgba(7,11,18,.55) 55%,rgba(7,11,18,.2)),linear-gradient(0deg,var(--bg) 0%,transparent 60%)}
.hero-in{position:absolute;z-index:1;left:28px;bottom:22px;right:28px;display:flex;align-items:flex-end;gap:18px}
.hero h1{font-family:Cinzel,serif;font-size:34px;margin:0;color:var(--gold2);letter-spacing:.03em}
.hero .sub{color:var(--muted);font-size:13px;text-transform:capitalize}
.hero .meta{margin-left:auto;display:flex;gap:8px;align-items:center}
.content{padding:22px 28px 60px}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}

.group{display:grid;grid-template-columns:150px 1fr;gap:18px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:14px}
.group.nomods{opacity:.5}
.art{position:relative;width:150px;aspect-ratio:308/560;border-radius:8px;overflow:hidden;background:#141d2c;border:1px solid var(--line2)}
.art img{width:100%;height:100%;object-fit:cover;display:block}
.art .ic{position:absolute;inset:0;display:grid;place-items:center;font-size:42px;color:var(--dim)}
.gh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.gh h3{margin:0;font-size:18px;color:var(--gold2);font-weight:600}
.gh .num{color:var(--dim);font-size:12px}
.pick{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--teal);background:#08262a;border:1px solid #11484c;border-radius:6px;padding:2px 8px;margin-bottom:10px}
.conf{font-size:12px;color:var(--warn);margin-left:4px}
.mods{display:flex;flex-direction:column;gap:8px}
.mod{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--ok);border-radius:8px;padding:10px 12px}
.mod.sev-error{border-left-color:var(--err)}.mod.sev-warn{border-left-color:var(--warn)}.mod.sev-info{border-left-color:var(--info)}
.mod.flash{animation:flash 2.2s ease}
@keyframes flash{0%,40%{box-shadow:0 0 0 2px var(--gold)}100%{box-shadow:none}}
.thumb{width:56px;height:56px;border-radius:6px;object-fit:cover;background:#0b111b;border:1px solid var(--line2);cursor:zoom-in}
.thumb.none{display:grid;place-items:center;color:var(--dim);font-size:11px;cursor:default;text-align:center}
.mt{font-weight:600;font-size:14.5px;word-break:break-word}
.ms{color:var(--muted);font-size:12px;margin-top:1px;word-break:break-all}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{font-size:11.5px;padding:2px 8px;border-radius:5px;background:#1a2537;border:1px solid var(--line2);color:var(--muted)}
.chip.t{color:var(--gold2);border-color:#5a4a2a;background:#231d10}
.chip.looks{color:#c9b6ff;border-color:#4a3a7a;background:#1b1530}
.issue{display:flex;gap:7px;align-items:flex-start;font-size:12.5px;margin-top:5px}
.issue .i{flex:none;width:16px;height:16px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;margin-top:1px}
.issue.error{color:#ffb3b5}.issue.error .i{background:var(--err);color:#fff}
.issue.warn{color:#ffd99a}.issue.warn .i{background:var(--warn);color:#111}
.issue.info{color:#a9cfff}.issue.info .i{background:#24456e;color:#cfe4ff}
.acts{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.children{margin-top:8px;font-size:12px;color:var(--muted);border-top:1px dashed var(--line2);padding-top:6px}
.children div{padding:1px 0}

.empty-state{max-width:760px;margin:40px auto;text-align:center;color:var(--muted)}
.drop-hint{border:2px dashed var(--line2);border-radius:14px;padding:38px 20px;margin:20px 0;background:var(--panel)}
.drop-hint h2{color:var(--gold2);font-family:Cinzel,serif;margin:0 0 8px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:18px;text-align:left}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card .v{font-size:26px;font-weight:700;color:var(--text)}
.card .l{font-size:12px;color:var(--muted)}
.card.e .v{color:var(--err)}.card.w .v{color:var(--warn)}
.recent{margin-top:22px;text-align:left}
.recent h4{color:var(--gold);margin:0 0 8px;font-weight:600}
.ev{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-bottom:6px;font-size:13px;cursor:pointer}
.ev:hover{border-color:var(--line2)}

.overlay{position:fixed;inset:0;background:rgba(5,9,15,.88);display:none;place-items:center;z-index:50}
.overlay.show{display:grid}
.drop-box{border:3px dashed var(--gold);border-radius:20px;padding:60px 90px;text-align:center;background:rgba(200,170,110,.06)}
.drop-box h2{font-family:Cinzel,serif;color:var(--gold2);font-size:30px;margin:0 0 8px}
.modal-bg{position:fixed;inset:0;background:rgba(3,6,10,.75);display:none;align-items:flex-start;justify-content:center;z-index:40;padding:50px 16px;overflow:auto}
.modal-bg.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:14px;width:min(980px,100%);max-height:calc(100vh - 100px);display:flex;flex-direction:column}
.modal-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.modal-h h2{margin:0;font-size:18px;color:var(--gold2)}
.modal-b{padding:14px 20px;overflow:auto}
.modal-f{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;align-items:center}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500;position:sticky;top:0;background:var(--panel)}
td.path{color:var(--muted);word-break:break-all}
tr.click{cursor:pointer} tr.click:hover td{background:var(--panel2)}
.toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:60;max-width:420px}
.toast{background:#101a29;border:1px solid var(--line2);border-left:4px solid var(--teal);border-radius:8px;padding:10px 14px;font-size:13px;box-shadow:0 8px 30px rgba(0,0,0,.45)}
.toast.bad{border-left-color:var(--err)}.toast.dup{border-left-color:var(--warn)}
.progress{height:3px;background:var(--line);position:relative;overflow:hidden;border-radius:2px;width:160px}
.progress i{position:absolute;left:0;top:0;bottom:0;background:var(--gold);transition:width .3s}
.scanning{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;place-items:center;z-index:70;cursor:zoom-out}
.lightbox.show{display:grid}.lightbox img{max-width:90vw;max-height:90vh;border-radius:8px}
.menu{position:relative}
.btn.upd{background:#123524;border-color:#2f8f5b;color:#7ee2a8}.btn.upd:hover{background:#18452f}
.upd-notes{white-space:pre-wrap;background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:10px 12px;max-height:300px;overflow:auto;font-size:13px;color:var(--muted)}
.ltk-ctl{cursor:pointer;margin-left:4px}.ltk-ctl:hover{border-color:var(--line2);color:var(--text)}.ltk-ctl.bad:hover{border-color:var(--err);color:#ffb3b5}
@keyframes jumpflash{0%{background:rgba(240,199,94,.35)}100%{background:transparent}}.jumped{animation:jumpflash 1.2s ease-out}
#jumpLetter{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);font:700 72px Cinzel,serif;color:var(--gold2);background:rgba(10,14,22,.85);border:1px solid var(--line2);border-radius:18px;padding:6px 34px;pointer-events:none;opacity:0;z-index:90}
#jumpLetter.show{animation:jumpshow .7s ease-out}@keyframes jumpshow{0%{opacity:1}60%{opacity:1}100%{opacity:0}}
.menu-pop{position:absolute;right:0;top:110%;background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:6px;display:none;min-width:240px;z-index:30;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.menu-pop.show{display:block}
.menu-pop button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:6px;font-size:13px}
.menu-pop button:hover{background:#1c2739;color:var(--gold2)}
.menu-pop small{display:block;color:var(--dim);font-size:11px}
.v3d-bg{position:fixed;inset:0;background:rgba(3,6,10,.86);display:none;z-index:45;padding:28px}
.v3d-bg.show{display:flex}
.v3d{flex:1;display:grid;grid-template-columns:1fr 320px;background:var(--panel);border:1px solid var(--line2);border-radius:14px;overflow:hidden;min-height:0}
.v3d-stage{position:relative;background:radial-gradient(ellipse at 50% 35%,#1d2a40 0%,#0a0f18 70%);min-height:0}
.v3d-stage canvas{display:block;width:100%;height:100%}
.v3d-msg{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:14px;text-align:center;padding:30px;pointer-events:none}
.v3d-hint{position:absolute;left:14px;bottom:12px;font-size:11.5px;color:var(--dim)}
.v3d-side{border-left:1px solid var(--line);padding:16px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.v3d-side h2{margin:0;font-size:17px;color:var(--gold2)}
.v3d-side .sub{color:var(--muted);font-size:12.5px}
.anim-ctl{display:flex;align-items:center;gap:8px;margin-top:8px}
.anim-ctl input[type=range]{flex:1;min-width:0}
.seg.mini button{padding:3px 7px;font-size:11.5px}
.seg{display:flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.seg button{flex:1;background:none;border:0;padding:7px 8px;font-size:12.5px;color:var(--muted)}
.seg button.on{background:#2a2312;color:var(--gold2)}
.parts label{display:flex;gap:8px;align-items:center;font-size:12.5px;padding:3px 0;color:var(--text)}
.parts label span{color:var(--dim);font-size:11px;margin-left:auto}
.note{font-size:12.5px;color:#ffd99a;background:#251c08;border:1px solid #5a4416;border-radius:8px;padding:8px 10px}
.srcs{display:flex;flex-wrap:wrap;gap:6px}
.srcs .chip.mod{color:#9ff0c9;border-color:#1f6a4a;background:#0d2a1e}
.sw{position:relative;width:38px;height:22px;border-radius:11px;background:#2a3446;border:1px solid var(--line2);cursor:pointer;flex:none;transition:.15s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#8a97ab;transition:.15s}
.sw.on{background:#14553b;border-color:#1f8a5d}.sw.on::after{left:18px;background:#9ff0c9}
.sw.pending{box-shadow:0 0 0 2px var(--gold)}
.ltk-row.removing{opacity:.45;text-decoration:line-through}
.pendbar{position:sticky;top:0;z-index:5;display:flex;gap:10px;align-items:center;background:#2a2312;border:1px solid #7a6232;color:var(--gold2);border-radius:10px;padding:10px 14px;margin-bottom:14px}
.chip.new{color:#fff4c2;border-color:#c8aa6e;background:linear-gradient(90deg,#4a3a12,#2a2312);font-weight:600}
.newpill{font-size:10px;font-weight:700;letter-spacing:.04em;color:#1a1300;background:var(--gold);border-radius:6px;padding:0 5px;line-height:16px}
.mod.is-new{box-shadow:inset 3px 0 0 var(--gold)}
.chip.ltk-on{color:#9ff0c9;border-color:#1f6a4a;background:#0d2a1e}
.chip.ltk-off{color:var(--muted)}
.chip.bad{color:#ffd99a;border-color:#5a4416;background:#251c08}
.jobs-ind{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--gold2);cursor:pointer}
.spin{width:12px;height:12px;border:2px solid var(--gold);border-right-color:transparent;border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.job{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;font-size:12.5px}
.job .st{font-weight:600}.job.done .st{color:var(--ok)}.job.error .st{color:var(--err)}.job.running .st{color:var(--gold2)}
.job ul{margin:6px 0 0 16px;padding:0;color:var(--muted)}
.ltk-row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--line2);border-radius:8px;padding:9px 12px;margin-bottom:6px}
.ltk-row.on{border-left-color:var(--ok)}
.ltk-row img{width:40px;height:40px;border-radius:6px;object-fit:cover;object-position:top;border:1px solid var(--line2)}
.cmp-bg{position:fixed;inset:0;background:#05080d;display:none;z-index:46;flex-direction:column}
.cmp-bg.show{display:flex}
.cmp-h{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
.cmp-h h2{margin:0;font-size:17px;color:var(--gold2);font-family:Cinzel,serif;letter-spacing:.04em}
.cmp-body{flex:1;position:relative;min-height:0}
.cmp-body canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.cmp-grid{position:absolute;inset:0;display:grid;pointer-events:none}
.cmp-cell{position:relative;border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:space-between}
.cmp-cell:last-child{border-right:0}
.cmp-cell .top,.cmp-cell .bot{pointer-events:auto;padding:12px 14px;background:linear-gradient(180deg,rgba(5,8,13,.92),rgba(5,8,13,0))}
.cmp-cell .bot{background:linear-gradient(0deg,rgba(5,8,13,.95),rgba(5,8,13,0));display:flex;flex-direction:column;gap:6px}
.cmp-cell .nm{font-weight:700;font-size:15px;color:var(--gold2)}
.cmp-cell .sk{font-size:12.5px;color:var(--teal)}
.cmp-cell .msg{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13px;text-align:center;padding:20px;pointer-events:none}
.cmp-tray{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:35;background:#101a29;border:1px solid #7a6232;border-radius:12px;padding:8px 10px;display:none;gap:8px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.cmp-tray.show{display:flex}
.cmp-tray .it{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:4px 8px;font-size:12.5px;max-width:220px}
.cmp-tray .it span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmp-tray .it button{background:none;border:0;color:var(--muted);padding:0 2px}
.btn.cmp-on{border-color:var(--gold);color:var(--gold2);background:#2a2312}
@media (max-width:820px){.app{grid-template-columns:1fr}aside{display:none}header{grid-column:1}.group{grid-template-columns:1fr}.art{width:120px}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">SKIN VAULT<small>LoL mod manager</small></div>
    <div class="stats" id="stats"></div>
    <div class="spacer"></div>
    <div class="scanning" id="scanning" style="display:none"><span id="scanTxt">Scanning…</span><div class="progress"><i id="scanBar" style="width:0"></i></div></div>
    <div class="jobs-ind" id="jobsInd" style="display:none" onclick="openJobs()"><div class="spin"></div><span id="jobsTxt"></span></div>
    <button class="btn upd" id="updBtn" style="display:none" onclick="openUpdate()"></button>
    <button class="btn" onclick="select('__ltk')">🎮 LTK Manager</button>
    <button class="btn" onclick="openIssues()">⚠ Issues</button>
    <button class="btn" onclick="openDupes()">⧉ Duplicates</button>
    <button class="btn gold" onclick="openOrganize()">✦ Organize library</button>
    <button class="btn" onclick="rescan()">↻ Rescan</button>
    <div class="menu">
      <button class="btn" onclick="toggleMenu(event)">⋯</button>
      <div class="menu-pop" id="menu">
        <button onclick="filePick()">Import mod files…<small>Same as dragging files onto this window</small></button>
        <button onclick="undo()">Undo last move<small>Reverses the last import / organize / dedupe</small></button>

}
async function doSetup(){
  const v = id => document.getElementById(id).value.trim();
  document.getElementById('suGo').disabled = true; document.getElementById('suGo').textContent = 'Starting…';
  const r = await api('/api/setup', {library:v('suLib'), game_dir:v('suGame'), ltmao_dir:v('suLt'), ltk_dir:v('suLtk')});
  if (!r.ok){ document.getElementById('suMsg').textContent = r.msg; document.getElementById('suGo').disabled=false; document.getElementById('suGo').textContent='Start Skin Vault →'; return; }
  document.getElementById('suMsg').style.color = 'var(--muted)'; document.getElementById('suMsg').textContent = 'Scanning your mods for the first time…';
  for (let i=0;i<120;i++){ await new Promise(r=>setTimeout(r,1000)); try{ const d = await api('/api/state'); if (!d.setup){ location.reload(); return; } }catch(e){} }

function modCategory(m){
  if (m.champ) return m.champ;
  const t = (m.type||'');
  if (t==='Map') return 'Maps'; if (t==='Items') return 'Items'; if (t==='Emote') return 'Emotes';
  const top = (m.top||'').toLowerCase();
  if (['map','maps'].includes(top)) return 'Maps'; if (top==='items') return 'Items'; if (top==='emotes') return 'Emotes';
  if (top==='other') return 'Other';
  return 'Unsorted';
}
function modsFor(key){ return S.mods.filter(m=>modCategory(m)===key); }
function sevOf(list){ return list.some(m=>m.severity==='error')?'error':list.some(m=>m.severity==='warn')?'warn':null; }
function matchQ(m){ const q=S.q; if(!q) return true; return (m.name+' '+m.filename+' '+(m.author||'')+' '+(m.applies_label||'')).toLowerCase().includes(q); }

function renderStats(){
  const ms=S.mods, e=ms.filter(m=>m.severity==='error').length, w=ms.filter(m=>m.severity==='warn').length;
  const champsWith=new Set(ms.filter(m=>m.champ).map(m=>m.champ)).size;
  document.getElementById('stats').innerHTML = `<span><b>${ms.length}</b> mods</span><span><b>${champsWith}</b> champions</span><span class="e"><b>${e}</b> errors</span><span class="w"><b>${w}</b> warnings</span>`;
}
function renderSide(){
  const el = document.getElementById('champList');
  const q = S.q;
  let rows = Object.values(S.champs).sort((a,b)=>a.name.localeCompare(b.name)).map(c=>{
    const ms = modsFor(c.id);
    return {c, ms, n:ms.length, sev:sevOf(ms), qhit: q && ms.some(matchQ)};
  });
  rows = rows.filter(r=>{
    if (q) return r.c.name.toLowerCase().includes(q) || r.qhit;
    if (S.filters.hasMods && !r.n) return false;
    if (S.filters.issuesOnly && !r.sev) return false;
    return true;
  });
  const cats = CATS.map(k=>({k, ms:modsFor(k)})).filter(x=>x.ms.length && (!q || x.ms.some(matchQ)) && (!S.filters.issuesOnly || sevOf(x.ms)));
  let h = '';
  const nm = newMods();
  if (nm.length && !q){
    h += `<div class="crow ${S.sel==='__new'?'sel':''}" onclick="select('__new')"><div class="ph" style="color:#1a1300;background:var(--gold)">✨</div><div class="nm">Recently added</div><span class="newpill">${nm.length} NEW</span></div>`;
  }
  if (cats.length){
    h += `<div class="sec-label">Other</div>`;
    h += cats.map(x=>`<div class="crow ${S.sel===x.k?'sel':''}" onclick="select('${x.k}')"><div class="ph">${x.k==='Unsorted'?'?':x.k[0]}</div><div class="nm">${x.k}</div>${sevOf(x.ms)?`<span class="dot ${sevOf(x.ms)}"></span>`:''}<span class="badge">${x.ms.length}</span></div>`).join('');
  }
  h += `<div class="sec-label">Champions · ${rows.length}</div>`;
  h += rows.map(r=>`<div class="crow ${S.sel===r.c.id?'sel':''} ${r.n?'':'empty'}" onclick="select('${r.c.id}')">
      <img loading="lazy" src="${DD(S.data.ddragon)}/img/champion/${r.c.icon}" alt="">
      <div class="nm">${esc(r.c.name)}</div>${r.ms.some(isNew)?'<span class="newpill">NEW</span>':''}${r.sev?`<span class="dot ${r.sev}"></span>`:''}${r.n?`<span class="badge">${r.n}</span>`:''}</div>`).join('');
  setHTML(el, h || '<div style="padding:20px;color:var(--dim)">No matches</div>');
}
function select(k){ S.sel=k; renderSide(); renderMain(); document.getElementById('main').scrollTop=0; }
function toggle(f){ S.filters[f]=!S.filters[f]; document.getElementById({hasMods:'tgHas',issuesOnly:'tgIss',allSkins:'tgAll'}[f]).classList.toggle('on',S.filters[f]); renderSide(); renderMain(); }

function loadingArt(champ, num){ return `https://ddragon.leagueoflegends.com/cdn/img/champion/loading/${champ.id}_${num}.jpg`; }
function cdArt(champ, num){ return `https://cdn.communitydragon.org/latest/champion/${champ.key}/splash-art/centered/skin/${num}`; }

function groupMods(champ, ms){
  const groups = new Map();
  const add = (key, info, m) => { if(!groups.has(key)) groups.set(key, {...info, mods:[]}); if(m) groups.get(key).mods.push(m); };
  for (const m of ms){
    const t = m.type||'Skin';
    if (t.startsWith('Voice')) add('voice',{title:'Voice & SFX',icon:'🔊',order:1000},m);
    else if (t==='Loading screen') add('load',{title:'Loading screens',icon:'🖼',order:1001},m);
    else if (t.startsWith('Pack')) add('pack',{title:'Mod packs',icon:'📦',order:1003},m);
    else if (m.applies_to!==null && m.applies_to!==undefined) add('s'+m.applies_to,{num:m.applies_to,title:m.applies_label||('Skin #'+m.applies_to),order:m.applies_to},m);
    else if (m.applies_source==='multi') add('multi',{title:'Changes multiple skins',icon:'✦',order:998,multi:true},m);
    else add('unk',{title:'Unknown skin',icon:'?',order:999,unknown:true},m);
  }
  if (champ && S.filters.allSkins) for (const s of champ.skins) add('s'+s.num,{num:s.num,title:s.name,order:s.num});
  for (const g of groups.values()) g.mods.sort((a,b)=>(isNew(b)-isNew(a)) || ((b.added_at||0)-(a.added_at||0)));
  return [...groups.values()].sort((a,b)=>a.order-b.order);
}

function issueHtml(i){ const sym={error:'!',warn:'!',info:'i'}[i.level]; return `<div class="issue ${i.level}"><span class="i">${sym}</span><span>${esc(i.msg)}</span></div>`; }
function isNew(m){
  if (!m.added_at || !S.data) return false;
  const now = Date.now()/1000;
  if ((S.data.seen_ids||[]).includes(m.id)) return false;
  return m.added_at > (S.data.seen_before||0) && now - m.added_at < (S.data.new_days||3)*86400;
}
function ago(t){ const d = Date.now()/1000 - t; if (d < 90) return 'just now'; if (d < 3600) return Math.round(d/60)+' min ago'; if (d < 86400) return Math.round(d/3600)+' h ago'; return Math.round(d/86400)+' d ago'; }
function newMods(){ return S.mods.filter(isNew).sort((a,b)=>b.added_at-a.added_at); }
async function seenOne(id){ const r = await api('/api/seen',{ids:[id]}); S.data.seen_ids = r.seen_ids; renderSide(); renderMain(); }
async function markSeen(){ const r = await api('/api/seen',{}); S.data.seen_before = r.seen_before; toast('Cleared the NEW tags'); renderSide(); renderMain(); }
function modHtml(m){

    S.sel==='__new' && champ ? `<span class="chip" style="color:var(--gold2)">${esc(champ.name)}</span>` : '',
    `<span class="chip t">${esc(m.type)}</span>`,
    `<span class="chip">${esc(ext)}</span>`,
    m.size?`<span class="chip">${fmtSize(m.size)}</span>`:'',

    (m.skins&&m.skins.length>1&&champ)?`<span class="chip">Touches skins: ${m.skins.slice(0,10).join(', ')}${m.skins.length>10?'…':''}</span>`:'',
    m.applies_source==='name'?`<span class="chip" title="Detected from the mod name, not its files">guessed from name</span>`:'',
    folderChip(m),
    ltkBadge(m),
  ].join('');
  const looksSrc = (champ && m.looks_like!=null && m.looks_like!==m.applies_to) ? loadingArt(champ, m.looks_like) : null;
  const thumb = m.has_image ? `<img class="thumb" loading="lazy" src="/api/image?id=${m.id}" onclick="lightbox(this.src)" onerror="this.outerHTML='<div class=&quot;thumb none&quot;>no img</div>'">`
    : looksSrc ? `<img class="thumb" loading="lazy" title="Official art of ${esc(m.looks_label)} (what this mod looks like)" src="${looksSrc}" style="object-position:top" onclick="lightbox(this.src)" onerror="this.outerHTML='<div class=&quot;thumb none&quot;>no preview</div>'">`
    : `<div class="thumb none">no preview</div>`;
  const kids = (m.children||[]).length ? `<div class="children">${m.children.map(c=>`<div>• ${esc(c.name)} ${c.champ?'→ <b>'+esc(S.champs[c.champ]?.name||c.champ)+'</b>':''} ${c.applies_label?'· '+esc(c.applies_label):''}</div>`).join('')}</div>` : '';
  const acts = [
    m.champ && !/^(Voice|Loading|Pack)/.test(m.type||'') && !/\.(7z|rar)$/i.test(m.filename) ? `<button class="btn small primary" onclick="open3D({id:'${m.id}'})">🧊 3D view</button>` + cmpBtn({id:m.id}) : '',
    m.rig && (['twisted','partly','offset'].includes(m.rig.verdict) || (m.rig.masks && m.rig.masks.fixable)) && !/\.(7z|rar)$/i.test(m.filename) ? `<button class="btn small ${m.rig.verdict==='partly'?'':'gold'}" onclick="fixDlg('${m.id}')" title="Re-attach the parts that follow the wrong bones">🦴 Fix bones</button>` : '',
    m.champ && !/^(Voice|Loading|Pack)/.test(m.type||'') && !/\.(7z|rar)$/i.test(m.filename) ? `<button class="btn small ${m.outdated?'gold':''}" onclick="fixDlg('${m.id}')">🛠 Auto-fix</button>` : '',
    `<button class="btn small" onclick="openMod('${m.id}')">📂 Show in folder</button>`,
    (m.children||[]).length?`<button class="btn small gold" onclick="unpack('${m.id}')">Unpack</button>`:'',
    `<button class="btn small" onclick="assignDlg('${m.id}')">Reassign</button>`,
    (/\.zip$/i.test(m.filename) && m.champ && !(m.children||[]).length && !S.ltkStage[m.id]) ? `<button class="btn small" title="Convert to .fantome now (LTK Manager installs these faster)" onclick="convertMods(['${m.id}'])">⇢ .fantome</button>` : '',
    `<button class="btn small" style="color:#ffb3b5" title="Send to the Recycle Bin" onclick="deleteDlg(['${m.id}'])">🗑 Delete</button>`,
    /\.(fantome|zip|wad\.client)$/i.test(m.filename) ? `<button class="btn small" title="Unpack with LtMAO into readable files and open the folder" onclick="unpackLt('${m.id}')">📦 Unpack</button>` : '',
  ].join('');
  return `<div class="mod sev-${m.severity} ${S.flash===m.id?'flash':''} ${isNew(m)?'is-new':''}" id="mod-${m.id}">
    ${thumb}
    <div><div class="mt">${esc(m.name)}</div>
      <div class="ms">${m.author?'by '+esc(m.author)+' · ':''}${m.version?'v'+esc(m.version)+' · ':''}${esc(m.rel)}</div>
      ${m.description?`<div class="ms" style="word-break:normal">${esc(m.description).slice(0,220)}</div>`:''}
      <div class="chips">${chips}</div>
      ${(m.issues||[]).map(issueHtml).join('')}
      ${kids}
    </div>
    <div class="acts">${acts}</div></div>`;
}

function renderMain(){
  const el = document.getElementById('main');

  const groups = groupMods(champ, ms);
  let h = '';
  if (champ){
    h += `<div class="hero" style="background-image:url('https://ddragon.leagueoflegends.com/cdn/img/champion/splash/${champ.id}_0.jpg')"><div class="hero-in">

  } else {

             : g.unknown ? `<div class="pick" style="color:var(--warn);border-color:#5a4416;background:#251c08">Couldn't tell which skin — use Reassign</div>` : '';
    h += `<div class="group ${g.mods.length?'':'nomods'}"><div class="art">${art}</div><div>
        <div class="gh"><h3>${esc(g.title)}</h3><span class="num">${g.mods.length} mod${g.mods.length===1?'':'s'}</span>${champ && g.num!==undefined ? `<span style="margin-left:auto;display:flex;gap:6px">${(()=>{ const add = g.mods.filter(m=>S.ltk.found && !ltkFor(m) && !S.ltkAdded[m.id] && !(S.ltkAdding||[]).includes(m.id) && /\.(fantome|zip)$/i.test(m.filename) && !m.dup_of); return add.length>1 ? `<button class="btn small" onclick="ltkAdd(${JSON.stringify(add.map(m=>m.id)).replace(/"/g,'&quot;')})">＋ Add ${add.length} to LTK</button>` : ''; })()}<button class="btn small" onclick="open3D({champ:'${champ.id}',skin:${g.num}})">🧊 Original in 3D</button>${cmpBtn({champ:champ.id, skin:g.num})}</span>`:''}</div>${pick}
        <div class="mods">${g.mods.map(modHtml).join('') || '<div style="color:var(--dim);font-size:13px">No mods for this skin</div>'}</div></div></div>`;
  }
  h += `</div>`;
  setHTML(el, h);
  if (S.flash){ const n=document.getElementById('mod-'+S.flash); if(n) n.scrollIntoView({block:'center'}); S.flash=null; }
}

function renderNew(el){
  const ms = newMods().filter(matchQ);
  const day = t => { const d = new Date(t*1000), n = new Date(); const diff = Math.floor((new Date(n.toDateString()) - new Date(d.toDateString()))/86400000); return diff===0?'Today':diff===1?'Yesterday':d.toLocaleDateString(undefined,{weekday:'long', month:'short', day:'numeric'}); };
  const groups = {}; ms.forEach(m=>{ const k = day(m.added_at); (groups[k]=groups[k]||[]).push(m); });
  setHTML(el, `<div class="hero" style="height:130px"><div class="hero-in"><div><h1>Recently added</h1><div class="sub">${ms.length} new mod${ms.length===1?'':'s'} in the last ${S.data.new_days||3} days</div></div>
      <div class="meta" style="margin-left:auto"><button class="btn small" onclick="markSeen()">✓ Mark all as seen</button></div></div></div>

    ${Object.entries(groups).map(([k,list])=>`<div class="sec-label" style="padding:6px 0 8px">${esc(k)} · ${list.length}</div><div class="mods" style="margin-bottom:18px">${list.map(m=>{

        return `<div style="display:flex;gap:10px;align-items:stretch">${art}<div style="flex:1;min-width:0">${modHtml(m)}</div></div>`; }).join('')}</div>`).join('')}
    </div>`);
}

}
function openDupes(){
  const rows = S.mods.filter(m=>m.dup_of);

let jobsTimer=null;
async function pollJobs(){
  clearTimeout(jobsTimer);
  const j = await api('/api/jobs'); S.jobs = j.jobs;
  const active = j.jobs.filter(x=>x.status==='running'||x.status==='queued');
  document.getElementById('jobsInd').style.display = active.length?'flex':'none';
  if (active.length){ const r = active.find(x=>x.status==='running'); document.getElementById('jobsTxt').textContent = `Fixing ${r?esc(r.name).slice(0,28):''} · ${active.length} left`; jobsTimer=setTimeout(pollJobs,1500); }
  if (document.getElementById('jobsList')) renderJobs();
}
function openJobs(){ closeMenus(); modal(`<div class="modal-h"><h2>Auto-fix</h2><div class="spacer"></div><button class="btn small" onclick="closeModal()">✕</button></div><div class="modal-b" id="jobsList">Loading…</div>`); pollJobs(); }
function renderJobs(){
  const el = document.getElementById('jobsList'); const jobs = (S.jobs||[]).slice().reverse();
  el.innerHTML = jobs.length ? jobs.map(j=>{ const r=j.report||{}; const v=r.verify||{};
    return `<div class="job ${j.status}"><div><span class="st">${{queued:'Queued',running:'Fixing…',done:'Fixed',error:'Failed'}[j.status]}</span> · <b>${esc(j.name)}</b> → ${esc(skinName(j.champ,j.slot))}</div>
      ${j.error?`<div style="color:#ffb3b5;margin-top:4px">${esc(j.error)}</div>`:''}
      ${j.out_rel?`<div class="ms" style="margin-top:4px">Saved: ${esc(j.out_rel)}${j.original?' · original kept in '+esc(j.original):''}</div>`:''}
      ${j.status==='done'?`<div style="margin-top:4px">${v.outdated?'<span style="color:var(--warn)">⚠ Still looks outdated after fixing - the mod may not contain a model/texture for this skin.</span>':`<span style="color:var(--ok)">✔ Check: now shows on ${esc(v.applies_label||'')}</span>`} ${j.out_id?`<button class="btn small primary" onclick="closeModal();open3D({id:'${j.out_id}'})">🧊 View in 3D</button>`:''}</div>`:''}
      ${j.ltk_swapped?'<div style="color:var(--ok);margin-top:4px">✔ Swapped into LTK Manager</div>':''}${j.ltk_swap_error?`<div style="color:#ffb3b5;margin-top:4px">LTK swap failed: ${esc(j.ltk_swap_error)}</div>`:''}
      ${(r.mapped||[]).length?`<ul>${r.mapped.map(x=>`<li>${esc(x.what)}: ${esc(x.from)} → ${esc(x.to)}</li>`).join('')}</ul>`:''}
      ${(r.warnings||[]).map(w=>`<div style="color:#ffd99a;margin-top:4px">⚠ ${esc(w)}</div>`).join('')}
      ${j.status==='running'?`<ul>${j.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>`:''}</div>`; }).join('') : '<p style="color:var(--muted)">No fixes run yet. Use 🛠 Auto-fix on any mod.</p>';
}
function skinName(c,n){ const ch=S.champs[c]; const s=ch&&ch.skins.find(x=>x.num===n); return (ch?ch.name+' · ':'')+(s?s.name:'skin #'+n); }

// ---------- 3D compare
S.cmp = [];
const cmpKey = it => it.id ? it.id : `${it.champ}:${it.skin}`;
function inCompare(it){ return S.cmp.some(x=>cmpKey(x)===cmpKey(it)); }
function cmpLabel(it){ if (it.id){ const m = anyMod(it.id); return m ? m.name : 'Mod'; } const c=S.champs[it.champ]; const sk=c&&c.skins.find(x=>x.num===it.skin); return 'Original · ' + (sk?sk.name:('skin '+it.skin)); }
function toggleCompare(it){
  if (inCompare(it)) S.cmp = S.cmp.filter(x=>cmpKey(x)!==cmpKey(it));
  else { if (S.cmp.length>=3){ toast('You can compare up to 3 at once - remove one from the tray first','bad'); return; } S.cmp.push(it); }
  renderTray(); renderMain();
  if (document.getElementById('v3dBg').classList.contains('show') && V.req) renderSide3D();
}
function cmpBtn(it, small=true){
  const on = inCompare(it); const arg = JSON.stringify(it).replace(/"/g,'&quot;');
  return `<button class="btn ${small?'small':''} ${on?'cmp-on':''}" title="${on?'Remove from compare':'Add to 3D compare (up to 3)'}" onclick="toggleCompare(${arg})">${on?'✓ Comparing':'⇆ Compare'}</button>`;
}
function renderTray(){
  const t = document.getElementById('cmpTray');
  if (!S.cmp.length){ t.classList.remove('show'); t.innerHTML=''; return; }
  t.classList.add('show');
  t.innerHTML = `<span style="font-size:12px;color:var(--gold2);font-weight:600;padding:0 4px">3D Compare</span>` +
    S.cmp.map((it,i)=>`<div class="it"><span>${esc(cmpLabel(it))}</span><button title="Remove" onclick="S.cmp.splice(${i},1);renderTray();renderMain()">✕</button></div>`).join('') +
    (S.cmp.length<3?`<span style="font-size:11.5px;color:var(--dim)">${3-S.cmp.length} more slot${S.cmp.length===2?'':'s'}</span>`:'') +
    `<button class="btn small gold" ${S.cmp.length<2?'disabled':''} onclick="openCompare()">Compare ${S.cmp.length}</button><button class="btn small" onclick="S.cmp=[];renderTray();renderMain()">Clear</button>`;
}
async function openCompare(){
  if (!window.V3C){ toast('3D engine still loading - try again in a second','bad'); return; }
  const items = S.cmp.slice(0,3);
  V3C.open(items.length);
  const grid = document.getElementById('cmpGrid');
  grid.style.gridTemplateColumns = `repeat(${items.length}, 1fr)`;
  grid.innerHTML = items.map((it,i)=>`<div class="cmp-cell" id="cc${i}"><div class="top"><div class="nm">${esc(cmpLabel(it))}</div><div class="sk" id="cs${i}"></div></div><div class="msg" id="cm${i}">Loading…</div><div class="bot" id="cb${i}"></div></div>`).join('');
  const champs = new Set();
  await Promise.all(items.map(async (it,i)=>{
    const url = it.id ? `/api/3d/model?id=${encodeURIComponent(it.id)}` : `/api/3d/model?champ=${it.champ}&skin=${it.skin}`;
    try{
      const m = await api(url);
      if (m.error){ document.getElementById('cm'+i).textContent = m.error; return; }
      champs.add(m.champ);
      V3C.set(i, m);
      document.getElementById('cm'+i).style.display='none';
      document.getElementById('cs'+i).innerHTML = `🎮 pick in game: <b>${esc(m.skin_label)}</b>${S.champs[m.champ]?' · '+esc(S.champs[m.champ].name):''}`;
      document.getElementById('cb'+i).innerHTML = cmpCellFooter(it, m);
    }catch(e){ document.getElementById('cm'+i).textContent = 'Failed: '+e; }
  }));
  document.getElementById('cmpSub').textContent = items.length + ' models' + (champs.size>1?' · different champions':'');
  renderCmpAnim();
}
const CMP_WORDS = ['idle','run','attack','crit','spell1','spell2','spell3','spell4','dance','laugh','joke','taunt','recall','death'];
function renderCmpAnim(){
  const have = new Set(V3C.words()), st = V3C.state;
  const words = CMP_WORDS.filter(w => have.has(w) || [...have].some(h => h.startsWith(w)));
  document.getElementById('cmpAnim').innerHTML = `<option value="">Bind pose</option>` + words.map(w => `<option value="${w}" ${st.word===w?'selected':''}>${w[0].toUpperCase()+w.slice(1).replace(/(\d)/,' $1')}</option>`).join('');
  document.getElementById('cmpPlay').textContent = st.playing ? '⏸' : '▶';
  document.getElementById('cmpPlay').style.display = st.word ? '' : 'none';
  document.getElementById('cmpSpeed').innerHTML = st.word ? [.25,.5,1].map(x=>`<button class="${st.speed===x?'on':''}" onclick="V3C.speed(${x});renderCmpAnim()">${x===1?'1×':x+'×'}</button>`).join('') : '';
}
async function cmpAnim(w){ await V3C.anim(w); V3C.play(true); renderCmpAnim(); }
function cmpPlay(){ V3C.play(!V3C.state.playing); renderCmpAnim(); }
function cmpCellFooter(it, m){
  const src = (k,v)=> v ? `<span class="chip ${v==='mod'?'mod':''}">${k}: ${v==='mod'?'mod':'original'}</span>` : '';
  const mod = it.id ? anyMod(it.id) : null;
  const lib = mod && !it.id.startsWith('ltk:') ? mod : null;
  const ltk = it.id && it.id.startsWith('ltk:') ? mod : (lib ? ltkFor(lib) : null);
  const acts = [
    `<button class="btn small primary" onclick="closeCompare();open3D(${JSON.stringify(it).replace(/"/g,'&quot;')})">🧊 Open</button>`,
    ltk ? `<span class="chip ${ltk.enabled?'ltk-on':'ltk-off'}">${ltk.enabled?'● In LTK · enabled':'○ In LTK · off'}</span>` :
      (lib && /\.(fantome|zip)$/i.test(lib.filename) ? `<button class="btn small gold" onclick="ltkAdd(['${lib.id}']);this.disabled=true;this.textContent='⏳ Adding…'">＋ Add to LTK</button>` : ''),
    lib ? `<button class="btn small" onclick="openMod('${lib.id}')">📂</button>` : '',
    lib ? `<button class="btn small" style="color:#ffb3b5" onclick="deleteDlg(['${lib.id}'])">🗑 Delete</button>` : '',
  ].join('');
  return `<div class="srcs">${src('Model',m.sources.mesh)}${src('Textures',m.sources.texture)}</div>
    ${m.notes.length?`<div style="font-size:11.5px;color:#ffd99a">${esc(m.notes[0]).slice(0,140)}</div>`:''}
    <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">${acts}</div>`;
}
function deleteDlg(ids){
  const ms = ids.map(i=>S.mods.find(x=>x.id===i)).filter(Boolean); if(!ms.length) return;
  const inLtk = ms.filter(m=>ltkFor(m));
  modal(`<div class="modal-h"><h2>Delete ${ms.length===1?'“'+esc(ms[0].name)+'”':ms.length+' mods'}?</h2><div class="spacer"></div><button class="btn small" onclick="closeModal()">✕</button></div>
    <div class="modal-b"><p style="margin-top:0">${ms.map(m=>`<div class="path">${esc(m.rel)}</div>`).join('')}</p>
      <p style="color:var(--muted)">It goes to the <b>Windows Recycle Bin</b>, so you can restore it from there if you change your mind.</p>
      ${inLtk.length?`<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="delLtk" checked> Also remove ${inLtk.length===1?'it':inLtk.length+' of them'} from LTK Manager <span style="color:var(--muted);font-size:12px">(LTK restarts for a moment)</span></label>`:''}
    </div>
    <div class="modal-f"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn" style="border-color:var(--err);color:#ffb3b5" onclick="doDelete(${JSON.stringify(ids).replace(/"/g,'&quot;')})">🗑 Delete</button></div>`);
}
async function doDelete(ids){
  const lt = document.getElementById('delLtk'); closeModal();
  const r = await api('/api/delete',{ids, remove_ltk: !!(lt && lt.checked)});
  S.mods = S.mods.filter(m=>!r.deleted.some(d=>d.id===m.id));
  S.cmp = S.cmp.filter(it=>!r.deleted.some(d=>d.id===it.id)); renderTray();
  renderStats(); renderSide(); renderMain();
  if (r.deleted.length) toast(`🗑 Sent ${r.deleted.length} mod(s) to the Recycle Bin${r.ltk&&!r.ltk.error?' and removed from LTK':''}`);
  if (r.failed.length) toast(`✖ Couldn't delete ${r.failed.length}: ${esc(r.failed.map(f=>f.name||f.id).join(', '))}`,'bad');
  if (r.ltk && r.ltk.error) toast('LTK: '+esc(r.ltk.error),'bad');
}
function closeCompare(){ V3C.close(); S.cmp = []; renderTray(); renderMain(); }

// ---------- 3D viewer
const V = {req:null, model:null, mats:null, mode:'mod', clip:null, speed:1, animErr:null};
async function open3D(req){
  if (!window.V3D){ toast('3D engine is still loading (needs internet the first time) - try again in a second.','bad'); return; }
  V.req = req; V.mode = req.id ? 'mod' : 'orig'; V.clip = null; V.model = null;
  V3D.show(); await load3D();
}
async function load3D(){
  const r = V.req; const msg = document.getElementById('v3dMsg');
  msg.style.display='grid'; msg.textContent = 'Loading model…';
  let url;
  if (V.mode==='mod') url = `/api/3d/model?id=${r.id}`;
  else { const m = r.id ? anyMod(r.id) : null; url = `/api/3d/model?champ=${r.champ||m.champ}&skin=${r.skin ?? (m.applies_to ?? (m.skins||[0])[0] ?? 0)}`; }
  try{
    const m = await api(url);
    if (m.error){ msg.textContent = m.error; V.model=null; renderSide3D(); return; }
    const prev = V.model && V.clip >= 0 && V.model.anims ? (V.model.anims[V.clip]||{}).name : null;
    V.model = m; V.mats = V3D.build(m); msg.style.display='none';
    // keep the same animation when flipping between "with this mod" and "original"; otherwise start on idle
    const same = prev && m.anims ? m.anims.findIndex(a => a.name === prev) : -1;
    V.clip = V.clip === -1 && V.model ? -1 : (same >= 0 ? same : V3D.defaultClip());
    renderSide3D(); V.animErr = await V3D.play(V.clip);
  }catch(e){ msg.textContent = 'Failed to load: '+e; }
  renderSide3D();
}
function rigFixMsg(r){
  const parts = [];
  if (r.verdict === 'offset') parts.push('The model is shifted off its skeleton - it will be moved back into place.');
  else if (['twisted','partly'].includes(r.verdict)) parts.push(`About ${Math.round((1-(r.agreement||0))*100)}% of the model follows the wrong bones - those parts get re-attached to the bones the original model uses.`);
  if (r.masks && r.masks.fixable) parts.push(`The skeleton's joints are in a different order than the game's animation masks expect (${r.masks.misplaced} joints) - a matching copy of the animation setup is added so blended animations move the right bones.`);
  return parts.join(' ');
}
async function pickClip(i){ V.clip = i; V.animErr = null; renderSide3D(); V.animErr = await V3D.play(i); V3D.pause(false); renderSide3D(); }
function togglePlay(){ const a = V3D.anim; V3D.pause(a.playing); renderSide3D(); }
function setSpeed(x){ V3D.speed(x); V.speed = x; renderSide3D(); }
function animBlock(m){
  if (!m) return '';
  if (!m.rig) return `<div class="sub" style="font-size:11.5px">This model has no skeleton, so it's shown in its bind pose.</div>`;
  const a = V3D.anim, cs = m.anims || [];
  if (!cs.length) return `<div><div class="sec-label" style="padding:0 0 6px">Animation</div><div class="sub" style="font-size:11.5px">No animations found for this skin - shown in its bind pose.</div></div>`;
  const sp = V.speed || 1;
  return `<div class="anim"><div class="sec-label" style="padding:0 0 6px">Animation</div>
    <select style="width:100%" onchange="pickClip(+this.value)"><option value="-1" ${V.clip<0?'selected':''}>Bind pose (no animation)</option>
      ${cs.map((c,i)=>`<option value="${i}" ${i===V.clip?'selected':''}>${esc(c.name)}${c.mod?' · from mod':''}</option>`).join('')}</select>
    ${V.clip>=0?`<div class="anim-ctl"><button class="btn small" onclick="togglePlay()">${a.playing?'⏸ Pause':'▶ Play'}</button>
      <input type="range" id="animScrub" min="0" max="1000" value="0" oninput="V3D.pause(true);V3D.seek(this.value/1000*V3D.anim.duration)" onchange="renderSide3D()">
      <div class="seg mini">${[.25,.5,1].map(x=>`<button class="${sp===x?'on':''}" onclick="setSpeed(${x})">${x===1?'1×':x+'×'}</button>`).join('')}</div></div>`:''}
    ${V.animErr?`<div class="note">${esc(V.animErr)}</div>`:''}
    <div class="sub" style="font-size:11px;margin-top:4px">The skin's real in-game animations. Twisted bones or stretched parts here will look the same in game.</div></div>`;
}
setInterval(() => { const el = document.getElementById('animScrub'); if (!el || !document.getElementById('v3dBg').classList.contains('show')) return;
  const a = V3D.anim; if (a.duration && document.activeElement !== el) el.value = Math.round((a.time % a.duration) / a.duration * 1000); }, 100);
function renderSide3D(){
  const r = V.req, m = V.model; const mod = r.id ? anyMod(r.id) : null;
  const champ = S.champs[(m&&m.champ) || r.champ || (mod&&mod.champ)];
  const srcChip = (k,v) => v ? `<span class="chip ${v==='mod'?'mod':''}">${k}: ${v==='mod'?'from mod':'original'}</span>` : '';
  document.getElementById('v3dSide').innerHTML = `
    <div style="display:flex;align-items:start;gap:8px"><div style="flex:1"><h2>${esc(mod?mod.name:(m?m.skin_label:''))}</h2>
      <div class="sub">${esc(champ?champ.name:'')}${m?' · in-game skin: <b style="color:var(--teal)">'+esc(m.skin_label)+'</b>':''}</div></div>
      <button class="btn small" onclick="V3D.hide()">✕</button></div>
    ${mod?`<div class="seg"><button class="${V.mode==='mod'?'on':''}" onclick="V.mode='mod';load3D()">With this mod</button><button class="${V.mode==='orig'?'on':''}" onclick="V.mode='orig';load3D()">Original skin</button></div>`:''}
    ${m?`<div class="srcs">${srcChip('Model',m.sources.mesh)}${srcChip('Textures',m.sources.texture)}${srcChip('Skin data',m.sources.skin_data)}</div>`:''}
    ${m&&m.notes.length?m.notes.map(n=>`<div class="note">${esc(n)}</div>`).join(''):''}
    ${m?`<div><div class="sec-label" style="padding:0 0 6px">Parts</div><div class="parts">${m.submeshes.map((s,i)=>`<label><input type="checkbox" ${!s.hidden?'checked':''} onchange="V.mats[${i}].visible=this.checked"> ${esc(s.name)} <span>${s.hidden?'hidden in game':''}</span></label>`).join('')}</div></div>`:''}
    <div>${cmpBtn(r.id?{id:r.id}:{champ:r.champ, skin:r.skin}, false)} ${S.cmp.length>=2?`<button class="btn gold" onclick="V3D.hide();openCompare()">Compare ${S.cmp.length}</button>`:''}</div>
    ${animBlock(m)}
    <label style="display:flex;gap:8px;align-items:center;font-size:12.5px"><input type="checkbox" id="v3dAuto" ${V3D.auto?'checked':''} onchange="V3D.setAuto(this.checked)"> Auto-rotate</label>
    ${m?`<div class="sub" style="font-size:11px;word-break:break-all">Mesh: ${esc(m.mesh_path||'')}</div>`:''}
    <div class="sub" style="font-size:11px">Effects/particles and special shaders aren't rendered.</div>`;
}

// ---------- updates
function renderUpdate(){
  const u = (S.data||{}).update || {}, b = document.getElementById('updBtn');
  document.getElementById('verTxt').textContent = 'Skin Vault v' + (S.data.version||'?') + (u.available ? ` · v${u.latest} available` : '');
  const show = u.available && u.dismissed !== u.latest;
  b.style.display = show ? '' : 'none';
  b.textContent = `⬆ Update to v${u.latest}`;
  if (show && !S.updToasted){ S.updToasted = true; toast(`⬆ <b>Skin Vault v${esc(u.latest)}</b> is available. Click <b>Update</b> at the top to install it.`); }
}
async function openUpdate(force){
  closeMenus();
  let u = (S.data||{}).update || {};
  if (force){ toast('Checking for updates…'); u = await api('/api/update?force=1'); S.data.update = u; renderUpdate(); }
  if (!u.available){
    const why = u.error ? `<p style="color:var(--muted)">Couldn't check right now: ${esc(u.error)}</p>` : `<p>You're on the latest version (v${esc(u.current||S.data.version)}).</p>`;
    modal(`<div class="modal-h"><h2>Updates</h2></div><div class="modal-b">${why}</div><div class="modal-f"><button class="btn" onclick="closeModal()">OK</button></div>`);
    return;
  }
  modal(`<div class="modal-h"><h2>Update available</h2></div><div class="modal-b">
    <p style="margin-top:0">Skin Vault <b>v${esc(u.latest)}</b> is out - you have v${esc(u.current)}.</p>
    ${u.notes ? `<div class="sub" style="margin-bottom:6px">What's new</div><div class="upd-notes">${esc(u.notes)}</div>` : ''}
    <p class="sub" style="margin-bottom:0">Updating replaces the program files only - your mods, settings, skin corrections and LTK setup are kept. Old files are saved in <code>_update_backup</code>. Skin Vault restarts by itself.</p></div>
    <div class="modal-f"><button class="btn" onclick="skipUpdate('${esc(u.latest)}')">Skip this version</button>
    ${u.url ? `<a class="btn" href="${esc(u.url)}" target="_blank" rel="noopener">View on GitHub</a>` : ''}
    <button class="btn gold" id="updGo" onclick="doUpdate()">Update now</button></div>`);
}
async function skipUpdate(v){ await api('/api/update/dismiss',{version:v}); S.data.update.dismissed=v; renderUpdate(); closeModal(); }
async function doUpdate(){
  const b = document.getElementById('updGo'); if (b){ b.disabled = true; b.textContent = 'Updating…'; }
  const r = await api('/api/update/apply',{});
  if (!r.ok){ toast('✖ ' + esc(r.msg||'Update failed'),'bad'); closeModal(); return; }
  fastPoll();
}
async function waitRestart(){
  toast('✔ Updated - restarting Skin Vault…');
  await new Promise(x=>setTimeout(x,2500));
  for (let i=0;i<60;i++){ try{ await api('/api/status'); location.reload(); return; }catch(e){} await new Promise(x=>setTimeout(x,1000)); }
}

// ---------- drag & drop import
let dragDepth=0;
window.addEventListener('dragenter', e=>{ if([...e.dataTransfer.types].includes('Files')){ dragDepth++; document.getElementById('dropOverlay').classList.add('show'); e.preventDefault(); }});
window.addEventListener('dragover', e=>{ e.preventDefault(); });
window.addEventListener('dragleave', e=>{ dragDepth=Math.max(0,dragDepth-1); if(!dragDepth) document.getElementById('dropOverlay').classList.remove('show'); });
window.addEventListener('drop', e=>{ e.preventDefault(); dragDepth=0; document.getElementById('dropOverlay').classList.remove('show'); uploadFiles([...e.dataTransfer.files]); });
function filePick(){ closeMenus(); document.getElementById('filepick').click(); }
document.getElementById('filepick').addEventListener('change', e=>{ uploadFiles([...e.target.files]); e.target.value=''; });
async function uploadFiles(files){
  if(!files.length) return;
  let last=null;
  for (const f of files){
    if (!/\.(fantome|zip|wad\.client|wad)$/i.test(f.name)){ toast(`✖ <b>${esc(f.name)}</b><br>Not a mod file. Drop .fantome, .zip or .wad.client (extract .rar/.7z first).`,'bad'); continue; }
    toast(`Importing <b>${esc(f.name)}</b>…`);
    try{
      const r = await fetch('/api/import',{method:'POST',headers:{'X-Filename':encodeURIComponent(f.name),'X-SkinVault':'1'},body:f});
      const j = await r.json();
      (j.results||[]).forEach(x=>{ showResult(x); if(x.ok&&x.champ) last=x; });
    }catch(err){ toast(`✖ ${esc(f.name)}: ${esc(err)}`,'bad'); }
  }
  setTimeout(async()=>{ await waitScan(); await load(); if(last){ S.flash=last.id; select(last.champ); } }, 600);
}
async function waitScan(){ for(let i=0;i<60;i++){ const s=await api('/api/status'); if(s.status==='idle') return; await new Promise(r=>setTimeout(r,500)); } }

// ---------- type a letter to jump (LTK page: champion sections; elsewhere: the champion list)
const _jump = {k:'', i:0, t:0};
document.addEventListener('keydown', e=>{
  if (e.ctrlKey || e.metaKey || e.altKey || e.repeat || !/^[a-z]$/i.test(e.key)) return;
  const t = e.target; if (t && (t.tagName==='INPUT' || t.tagName==='TEXTAREA' || t.tagName==='SELECT' || t.isContentEditable)) return;
  if (document.getElementById('modalBg').classList.contains('show') || document.getElementById('v3dBg').classList.contains('show') || document.getElementById('cmpBg').classList.contains('show')) return;
  const L = e.key.toUpperCase();
  const onLtk = S.sel==='__ltk';
  const box = onLtk ? document.getElementById('main') : document.getElementById('champList');
  const items = onLtk ? [...box.querySelectorAll('.sec-label[data-l]')] : [...box.querySelectorAll('.crow')].filter(r=>r.querySelector('img'));
  const nameOf = el => (onLtk ? el.dataset.l : (el.querySelector('.nm')||{}).textContent || '').trim().toUpperCase();
  let hits = items.filter(el=>nameOf(el).startsWith(L));
  if (!hits.length) hits = items.filter(el=>nameOf(el) > L).slice(0,1);   // nothing with that letter: next one after it
  if (!hits.length) return;
  e.preventDefault();
  const same = _jump.k===L && Date.now()-_jump.t < 4000; _jump.i = same ? (_jump.i+1) % hits.length : 0; _jump.k = L; _jump.t = Date.now();
  const el = hits[_jump.i];
  const top = el.getBoundingClientRect().top - box.getBoundingClientRect().top + box.scrollTop - (onLtk ? 8 : 4);
  box.scrollTo({top, behavior:'smooth'});
  el.classList.remove('jumped'); void el.offsetWidth; el.classList.add('jumped');
  showJumpLetter(L);
});
function showJumpLetter(L){
  let b = document.getElementById('jumpLetter');
  if (!b){ b = document.createElement('div'); b.id = 'jumpLetter'; document.body.appendChild(b); }
  b.textContent = L; b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');
}

// ---------- live status
let fastUntil = 0;
function fastPoll(){ fastUntil = Date.now() + 30000; clearTimeout(window._pollT); poll(); }
async function poll(){
  try{
    const s = await api('/api/status?since='+S.since);
    const busy = s.status!=='idle';
    document.getElementById('scanning').style.display = busy?'flex':'none';
    if (busy){
      document.getElementById('scanTxt').textContent = s.status==='scanning' ? `Scanning ${s.progress}/${s.total||'?'}` : (s.current||'Working…');
      document.getElementById('scanBar').style.width = s.total ? (100*s.progress/s.total)+'%' : '10%';
    }
    if (s.events && s.events.length){
      S.events = (S.events||[]).concat(s.events);
      S.since = Math.max(...s.events.map(e=>e.t));
      s.events.filter(e=>e.origin==='ltk-stage').forEach(e=>{ S.ltkStage[e.lib_id] = e.stage; });
      const convs = s.events.filter(e=>e.origin==='convert');
      convs.forEach(e=>{
        delete S.ltkStage[e.lib_id];
        if (e.ok && e.new_id){
          S.ltkAdding = (S.ltkAdding||[]).map(x=>x===e.lib_id?e.new_id:x);
          const m = S.mods.find(x=>x.id===e.lib_id);
          if (m){ m.id = e.new_id; m.filename = m.filename.replace(/\.zip$/i,'.fantome'); m.rel = m.rel.replace(/\.zip$/i,'.fantome'); }
          S.cmp.forEach(it=>{ if(it.id===e.lib_id) it.id=e.new_id; });
        }
      });
      const convOk = convs.filter(e=>e.ok && !(S.ltkAdding||[]).includes(e.new_id)), convBad = convs.filter(e=>!e.ok);
      if (convOk.length) toast(convOk.length===1 ? `⇢ Converted <b>${esc(convOk[0].file)}</b> to .fantome` : `⇢ Converted ${convOk.length} mods to .fantome`);
      convBad.forEach(e=>toast(`✖ <b>${esc(e.file)}</b><br>${esc(e.msg)}`,'bad'));
      if (convs.length || s.events.some(e=>e.origin==='ltk-stage')) { renderMain(); fastPoll(); }
      const adds = s.events.filter(e=>e.origin==='ltk-add');
      adds.forEach(e=>{ S.ltkAdding=(S.ltkAdding||[]).filter(x=>x!==e.lib_id); delete S.ltkStage[e.lib_id]; if (e.ok && e.lib_id) S.ltkAdded[e.lib_id]=true; });
      const okAdds = adds.filter(e=>e.ok), badAdds = adds.filter(e=>!e.ok);
      if (okAdds.length) toast(okAdds.length===1 ? `✔ Added to LTK: <b>${esc(okAdds[0].file)}</b>` : `✔ Added ${okAdds.length} mods to LTK`);
      badAdds.forEach(e=>toast(`✖ <b>${esc(e.file)}</b><br>${esc(e.msg)}`,'bad'));
      if (adds.length) renderMain();
      if (s.events.some(e=>e.origin==='ltk-add')) loadLtk(true); else if (s.events.some(e=>e.ltk_changed)) loadLtk();
      s.events.filter(e=>e.origin==='update').forEach(e=>{ if (e.ok) waitRestart(); else { closeModal(); toast('✖ Update failed: ' + esc(e.msg||''),'bad'); } });
      s.events.filter(e=>e.origin!=='browser' && !e.ltk_changed && !['ltk-add','ltk-stage','convert','update'].includes(e.origin)).forEach(e=>{ if(!document.hidden) showResult(e); });
    }
    if (s.last_scan && s.last_scan!==S.lastScan){ await load(); }
  }catch(e){}
  window._pollT = setTimeout(poll, (Date.now() < fastUntil || (S.ltkAdding||[]).length) ? 500 : 2000);
}
document.getElementById('q').addEventListener('input', e=>{ S.q=e.target.value.trim().toLowerCase(); renderSide(); renderMain(); });
load().then((ok)=>{ if (ok===false) return; poll(); loadLtk(); pollJobs(); setInterval(()=>{ if(S.ltk.loading) loadLtk(); }, 3000); });
</script>
